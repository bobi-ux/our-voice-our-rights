<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Voice, Our Rights - MGNREGA Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>🧑‍🌾 Our Voice, Our Rights</h1>
    <p>Understand MGNREGA performance in your district, simply and clearly.</p>
  </header>

  <main>
    <section class="selector">
      <label for="district">Select your District:</label>
      <select id="district">
        <option value="">-- Choose District --</option>
        <option value="Purba Bardhaman">Purba Bardhaman</option>
        <option value="Paschim Medinipur">Paschim Medinipur</option>
        <option value="Bankura">Bankura</option>
        <option value="Birbhum">Birbhum</option>
      </select>
      <button id="loadData">Load Data</button>
    </section>

    <section id="dataSection" class="hidden">
      <h2 id="districtName"></h2>
      <canvas id="performanceChart"></canvas>
      <div class="stats">
        <p><b>Total Households Worked:</b> <span id="households"></span></p>
        <p><b>Person Days Generated:</b> <span id="persondays"></span></p>
        <p><b>Average Days per Household:</b> <span id="avgdays"></span></p>
      </div>
    </section>
  </main>

  <footer>
    <p>Data Source: <a href="https://data.gov.in" target="_blank">data.gov.in</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
